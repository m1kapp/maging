<!DOCTYPE html>
<html lang="ko" data-theme="stripe">
<head>
  <meta charset="UTF-8">
  <script>!function(){var T=["flow","morningmate","claude","linear","stripe","airbnb","linkedin","apple","duolingo","github","spotify","netflix","figma","adobe","bloomberg"],k="maging-theme",s=localStorage.getItem(k);if(!s||T.indexOf(s)<0)s="stripe";document.documentElement.setAttribute("data-theme",s);localStorage.setItem(k,s)}();</script>
  <title>고객의 고객을 위한 AI 활용 전략</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../dist/maging.css">
  <script defer src="../dist/maging-all.js" data-base="../dist/" data-no-tailwind></script>
  <script type="module" src="../components/site.js"></script>
  <script defer src="../dist/maging-pitch.js"></script>
</head>
<body class="mw-themed">
  <maging-nav active="demo"></maging-nav>
  <div class="flex">
  <pitch-sidebar active="cover" data-title="AI 활용 전략" data-round="Strategy · 2026.05"></pitch-sidebar>
  <main class="flex-1 px-6 py-4" style="word-break: keep-all; min-width: 0">
    <div class="max-w-[1240px] mx-auto" id="slides-wrap">

      <section class="slide cover-slide" id="cover" data-active>
        <div class="cover-host"></div>
      </section>
      <section class="slide" id="chain" data-label="01 · Value Chain"></section>
      <section class="slide" id="problem" data-label="02 · Problem"></section>
      <section class="slide" id="scene" data-label="03 · 실제 사례"></section>
      <section class="slide cover-slide" id="insight" data-label="04 · Insight"></section>
      <section class="slide" id="framework" data-label="05 · Framework"></section>
      <section class="slide" id="case-profile" data-label="06 · Case Study"></section>
      <section class="slide" id="case-data" data-label="06 · 핵심 지표"></section>
      <section class="slide" id="support" data-label="07 · 3가지 서포트"></section>
      <section class="slide" id="compare-why" data-label="08 · Why This Works"></section>
      <section class="slide" id="scale" data-label="09 · Scale"></section>
      <section class="slide" id="workshop" data-label="10 · Workshop"></section>
      <section class="slide" id="evidence" data-label="11 · 증거"></section>
      <section class="slide" id="ask" data-label="12 · Next Step"></section>

    </div>
  </main>
  </div>

  <script>
  window.addEventListener('maging:ready', () => {
    window.DECK_MOUNT = {

      // ═══ S1: HERO ═══
      cover: () => Maging.pitchCover('#cover .cover-host', {
        company: '고객의 고객을 위한\nAI 활용 전략',
        tagline: 'AI가 내부 업무를 편하게 해주는 건 이미 다 아는 이야기입니다.\n우리가 제안하는 건 그 다음 단계입니다.',
        subtitle: 'STRATEGY REPORT · MAY 2026',
        style: 'minimal',
      }),

      // ═══ S2: VALUE CHAIN ═══
      chain: () => Maging.chainFlow('#chain', {
        headline: '가치 체인 — 3단 전달 구조',
        steps: [
          { label: 'FLOW AI', title: 'AI로 만든다', desc: 'AI 콘텐츠 생성 + 업무 관리 + 데이터 분석', accent: true },
          { label: 'YOUR TEAM', title: '직원이 무장된다', desc: '영업, 마케팅, BD — 고객 접점의 역량이 증폭됩니다' },
          { label: 'END CUSTOMER', title: '고객이 사로잡힌다', desc: '거래처·파트너사·환자가 먼저 찾아옵니다' },
        ],
        footer: '경영진이 귀를 여는 건 "업무 효율화"가 아니라 "매출 성장" 프레이밍입니다.',
      }),

      // ═══ S3: PROBLEM ═══
      problem: () => Maging.problemSlide('#problem', {
        headline: '기존 AI 세일즈는 틀린 질문을 하고 있다',
        points: [
          { icon: '⏱️', title: '"업무 효율이 올라갑니다"', desc: '경영진 반응: "근데 지금도 되긴 되는데…" 비용 절감 프레이밍은 도입 동기가 약합니다.' },
          { icon: '💰', title: '"시간이 절약됩니다"', desc: '실무자는 체감 못 합니다. 절약된 시간은 다른 업무로 채워질 뿐.' },
          { icon: '🤖', title: '"AI 시대에 뒤처지면 안 됩니다"', desc: '"그건 맞는데, 당장 뭘 하라고?" 공포 마케팅은 구체적 행동으로 이어지지 않습니다.' },
        ],
        highlight: '근본 원인: 도구의 가치를 내부 효율에만 국한 → ROI가 모호해진다.',
      }),

      // ═══ S4: 실제 사례 ═══
      scene: () => Maging.solutionSlide('#scene', {
        headline: '실제로 있었던 일입니다 — MR 김 대리의 사례',
        before: {
          label: 'Before',
          items: [
            '독감 시즌. 우리 백신을 써달라고 말로만 설명',
            '병원장은 "알겠습니다" 하고 기존 거래처 백신을 씀',
            '차별화 포인트가 없었음',
          ],
        },
        after: {
          label: 'AI + 직접 행동',
          items: [
            'AI로 "플루아릭스테트라" 홍보 전단지를 직접 제작',
            '근처 아파트 단지를 하루 동안 직접 돌며 배포',
            '예방접종 문의 증가 → 병원 매출 증가 → 병원장이 먼저 "그 백신 더 보내줘" 연락',
          ],
        },
      }),

      // ═══ S5: INSIGHT ═══
      insight: () => Maging.pitchCover('#insight', {
        company: 'AI가 있으면\n한 사람이 만들 수 있는\n<span style="color:var(--mw-accent)">가치의 폭</span>이 달라진다',
        tagline: '전단지뿐이 아닙니다. 리포트, 교육 자료, 캠페인, 분석까지.\n이걸 체계적으로 하면 어떻게 될까요?',
        style: 'bold',
      }),

      // ═══ S6: FRAMEWORK ═══
      framework: () => Maging.chainFlow('#framework', {
        headline: '이 사례를 구조화하면 — 가치 체인 3단 전달',
        steps: [
          { label: 'OUR PLATFORM', title: 'flow + flow AI', desc: 'AI 콘텐츠 생성 + 업무 관리 + 데이터 분석', accent: true },
          { label: '무장시킴', title: '기업 고객의 직원', desc: '영업, 마케팅, BD — 고객 접점의 역량 증폭' },
          { label: '사로잡음', title: '그들의 고객', desc: '병원, 거래처, 파트너사 — 최종 고객이 먼저 찾아온다' },
        ],
        footer: 'MR의 고객은 병원이고, 병원의 고객은 환자입니다. 환자가 오게 만들면, 병원이 먼저 찾아옵니다.',
      }),

      // ═══ S7: CASE STUDY ═══
      'case-profile': () => Maging.problemSlide('#case-profile', {
        headline: 'HK이노엔에 적용하면? — 사전 정보',
        points: [
          { icon: '💊', title: '케이캡 = K-신약 30호', desc: '국산 신약 매출 TOP 3. 55개국 글로벌 계약. 2028 목표 100개국.' },
          { icon: '🇺🇸', title: 'FDA NDA 제출 완료', desc: '5월 DDW 3상 데이터 공개. 성공 시 2027년 미국 출시.' },
          { icon: '⚖️', title: '비만약 임상 3상', desc: '에크노글루타이드 — K-신약 39~40호 후보. 글로벌 비만약 시장 130조(2030).' },
          { icon: '📈', title: '이익 체질 개선', desc: '1Q 영업이익 +30.8%. 매출 순위 8위→6위. 성장률 1위.' },
        ],
      }),

      // ═══ S8: 핵심 지표 ═══
      'case-data': () => Maging.metricHighlight('#case-data', {
        metrics: [
          { value: '1조+', unit: '', label: '연매출 (2025)\n제약 매출 6위' },
          { value: '30호', unit: '', label: 'K-신약 케이캡\n매출 TOP 3' },
          { value: '55', unit: '개국', label: '글로벌 계약\n2028 목표 100개국' },
          { value: 'FDA', unit: '', label: '미국 NDA 제출\nDDW 데이터 공개' },
        ],
      }),

      // ═══ S9: 3가지 서포트 ═══
      support: () => Maging.chainFlow('#support', {
        headline: 'AI가 직원에게 주는 세 가지 서포트',
        steps: [
          { label: 'SUPPORT 1', title: '마케팅', desc: '홍보 전단지 · 시즌 캠페인 · SNS 콘텐츠 · 건강 칼럼을 직접 만든다', accent: true },
          { label: 'SUPPORT 2', title: '데이터 분석', desc: '경쟁 분석 · 시즌 인사이트 · 처방 트렌드 · 환자 패턴을 읽는다' },
          { label: 'SUPPORT 3', title: '운영', desc: '간호사 교육 · 복약 안내 · 접수 체크리스트 · SOP로 퍼뜨린다' },
        ],
        footer: '전단지는 시작일 뿐입니다. AI가 있으면 한 사람이 마케팅·분석·운영 세 가지 지원을 동시에 받습니다.',
      }),

      // ═══ S10: WHY THIS WORKS ═══
      'compare-why': () => Maging.compareSlide('#compare-why', {
        headline: '왜 이 전략이 강력한가',
        left: {
          label: '기존 접근',
          rows: [
            { key: '프레이밍', value: '업무 효율화' },
            { key: '도입 근거', value: '비용 절감' },
            { key: '설득 대상', value: '실무자' },
            { key: 'KPI', value: '사용률' },
            { key: '워크샵 후', value: '"편하긴 한데…"' },
            { key: '지속성', value: '낮음' },
          ],
        },
        right: {
          label: '새로운 접근',
          rows: [
            { key: '프레이밍', value: '매출 성장' },
            { key: '도입 근거', value: '매출 기여' },
            { key: '설득 대상', value: '경영진까지' },
            { key: 'KPI', value: '고객 반응, 매출' },
            { key: '워크샵 후', value: '"다음 주에 써먹어야지"' },
            { key: '지속성', value: '높음' },
          ],
        },
        note: '비용 절감이 아니라 매출 성장으로 프레이밍하면, 경영진이 움직인다.',
      }),

      // ═══ S11: SCALE ═══
      scale: () => Maging.compareSlide('#scale', {
        headline: '한 명이 아니라 전원이 할 수 있다',
        left: {
          label: 'AI 없이',
          rows: [
            { key: '전단지', value: '포토샵 아는 1명만' },
            { key: '리포트', value: '엑셀 잘하는 1명만' },
            { key: '교육 자료', value: '본사 마케팅팀 요청' },
            { key: '속도', value: '요청 → 대기 → 수령' },
          ],
        },
        right: {
          label: 'AI + flow',
          rows: [
            { key: '전단지', value: '모든 MR이 직접' },
            { key: '리포트', value: '모든 MR이 직접' },
            { key: '교육 자료', value: '모든 MR이 직접' },
            { key: '속도', value: '필요 → 생성 → 즉시 배포' },
          ],
        },
        note: '한 명만 할 수 있던 일을 전원이 하게 만드는 것. 그것이 규모화(scale)입니다.',
      }),

      // ═══ S12: WORKSHOP ═══
      workshop: () => Maging.timelineSlide('#workshop', {
        headline: '워크샵 설계 — 100분',
        milestones: [
          { date: '10분', title: '현실 직시', desc: 'MR 차별화의 필요성', done: true },
          { date: '10분', title: '라이브 데모', desc: '담당 병원 전단지 즉석 생성', done: true },
          { date: '30분', title: '실습', desc: '담당 거래처 1곳, AI로 콘텐츠 3개 제작', active: true },
          { date: '15분', title: '공유 & 피드백', desc: '팀별 발표' },
          { date: '15분', title: 'flow 연결', desc: '거래처별 프로젝트 저장. 플라이휠 시작' },
        ],
      }),

      // ═══ S13: 증거 ═══
      evidence: () => Maging.chainFlow('#evidence', {
        headline: '이 리포트 자체가 증거입니다',
        steps: [
          { label: '마케팅', title: '맞춤 전략 리포트', desc: 'HK이노엔 맞춤 전략 리포트, 워크샵 시나리오, HTML 산출물 — 모두 flow AI로 제작', accent: true },
          { label: '데이터 분석', title: '시장 · 경쟁 분석', desc: '실적/파이프라인/FDA 분석, MR 페인포인트 진단, 경쟁사 비교 — 웹 검색 + 문서 분석' },
          { label: '운영', title: '워크샵 + 플레이북', desc: '내부 워크샵 설계, 부서별 액션 플랜, 세일즈 플레이북 — 프로젝트 관리 + 업무 할당' },
        ],
        footer: '"진짜 되나?" 궁금하셨을 겁니다. 이 리포트 자체가 flow AI로 만들어졌습니다.',
      }),

      // ═══ S14: CTA ═══
      ask: () => Maging.askSlide('#ask', {
        headline: 'Beyond Collaboration',
        useOfFunds: [
          { label: '킥오프 워크샵', pct: 30 },
          { label: '파일럿 (20명)', pct: 40 },
          { label: '전사 확대', pct: 30 },
        ],
        milestones: [
          '1주 내 킥오프 워크샵 일정 확정',
          '파일럿 팀 20명 선발 — 전문의약품 MR 우선',
          '3개월 후 전사 확대 여부 결정',
        ],
        contact: { email: 'hello@flow.team', website: 'flow.team' },
      }),

    };
  });
  </script>
</body>
</html>
