<!doctype html>
<html lang="ko" data-theme="flow">
  <head>

    <script src="https://cdn.tailwindcss.com"></script>

  </head>
  <body class="mw-themed">
    <script>
      window.addEventListener('maging:ready', function () {
        Maging.page({
          mode: 'slide',
          sidebarTitle: 'HK inno.N FLOW AI 워크샵',
          sidebarDate: '2026.5.20(수)',
          slides: [
            {
              id: 'cover',

              widgets: [{
                type: 'sectionCover',
                style: 'classic',

                title: 'AI가 닿는 반경',

              }],

              label: '공통 고충',
              widgets: [{

                  { icon: '📚', title: '자료 탐색 과부하', desc: '논문·정책·SOP 찾고 최신 버전 확인에 시간 소모' },

              }],
            },
            {
              id: 'r1',
              label: '반경① 나',
              widgets: [{
                type: 'compareSlide',
                headline: '반경① **나를 위한** AI',

                  { key: '메일', value: '매번 새로 작성' },
                ] },
                right: { label: 'After', rows: [
                  { key: '논문 요약', value: 'PDF 넣고 "요약해줘"' },
                  { key: '메일', value: '템플릿 + AI 조정' },
                ] },
              }],
            },
          ],
        });
      });
